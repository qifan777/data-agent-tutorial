server:
  port: 9933
spring:
  application:
    name: data-agent
  profiles:
    active: private
  datasource:
    url: jdbc:postgresql://localhost:5432/data_agent_tutorial
    username:
    password:
    driver-class-name: org.postgresql.Driver
  ai:
    openai:
      # 起凡 AI 中转站：http://ai.jarcheng.top/，注册赠送25刀，支持 OpenAI 协议
      # base-url 填 OpenAI 协议地址，不带 /v1，例如 http://ai.jarcheng.top
      base-url:
      # api-key 填中转站控制台创建的密钥
      api-key:
      chat:
        options:
          model:
      embedding:
        options:
          model: text-embedding-v4（阿里的）
    vectorstore:
      pgvector:
        index-type: HNSW      # 2026 年主流的高性能索引
        distance-type: cosine_distance # 语义搜索常用的余弦相似度
        dimensions: 1024      # text-embedding-v4 维度，如果更换了嵌入模型需要删除vector_store表重建
        initialize-schema: true  # 不填dimensions其实也可以，但是这样很多人换了模型不知道要修改dimensions，spring ai会自动初始化向量维度
jimmer:
  dialect: org.babyfish.jimmer.sql.dialect.PostgresDialect
  show-sql: true
  pretty-sql: true
  language: kotlin
  client:
    ts:
      path: /ts.zip
    openapi:
      path: /openapi
      ui-path: /openapi-ui
